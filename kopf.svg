<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img">
<style>
.z{fill:#221c15;stroke:#3d352b;stroke-width:1.5}
.b{font:600 23px 'Courier New', Consolas, monospace;fill:#ece4d6;text-anchor:middle;dominant-baseline:central}
.e{opacity:0;animation:ein .5s ease forwards}
@keyframes ein{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.name{animation:glow 4s ease-in-out 5s infinite}
@keyframes glow{0%,100%{fill:#ece4d6}50%{fill:#c9a227}}
.t1{font:300 76px Georgia, 'Times New Roman', serif;fill:#ece4d6;letter-spacing:-1px}
.t2{font:italic 300 24px Georgia, 'Times New Roman', serif;fill:#9a8f7f}
.t3{font:400 15px 'Courier New', Consolas, monospace;fill:#c9a227;letter-spacing:2px}
.fade{opacity:0;animation:ein .8s ease forwards}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect width="900" height="340" rx="14" fill="#16120e"/>
<rect x="1" y="1" width="898" height="338" rx="13" fill="none" stroke="#3d352b"/>
<g class="e" style="animation-delay:0.15s;transform-origin:100.0px 130.0px"><rect class="z" x="80" y="110" width="37" height="37" rx="2"/><text class="b name" x="98.5" y="129.5">E</text></g>
